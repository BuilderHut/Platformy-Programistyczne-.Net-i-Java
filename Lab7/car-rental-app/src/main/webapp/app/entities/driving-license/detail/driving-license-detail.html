<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (drivingLicense(); as drivingLicenseRef) {
      <div>
        <h2 data-cy="drivingLicenseDetailsHeading"><span jhiTranslate="carrentalApp.drivingLicense.detail.title">Driving License</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ drivingLicenseRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="carrentalApp.drivingLicense.licenseNumber">License Number</span></dt>
          <dd>
            <span>{{ drivingLicenseRef.licenseNumber }}</span>
          </dd>
          <dt><span jhiTranslate="carrentalApp.drivingLicense.issueDate">Issue Date</span></dt>
          <dd>
            <span>{{ drivingLicenseRef.issueDate | formatMediumDate }}</span>
          </dd>
          <dt><span jhiTranslate="carrentalApp.drivingLicense.expirationDate">Expiration Date</span></dt>
          <dd>
            <span>{{ drivingLicenseRef.expirationDate | formatMediumDate }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/driving-license', drivingLicenseRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
